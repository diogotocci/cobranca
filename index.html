<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8FD0F2" />
    <title>Cobrança!</title>
  </head>
  <body>
    <canvas id="game" aria-label="Campo de futebol com a bola, a barreira e o goleiro"></canvas>

    <div class="hud" aria-live="polite">
      <div class="panel score-panel">
        <span id="score" class="score">0/5</span>
        <span id="dots" class="dots" aria-hidden="true"></span>
      </div>
      <div id="distance" class="panel distance">FALTA</div>
      <p id="hint" class="hint">Arraste a partir da bola para chutar</p>
      <p id="banner" class="banner" hidden></p>
    </div>

    <svg id="swipe-layer" class="swipe-layer" preserveAspectRatio="none" aria-hidden="true">
      <polyline id="swipe-trail" points="" />
    </svg>

    <div id="round-over" class="round-over" hidden>
      <div class="card">
        <p class="card-title">Fim da rodada</p>
        <p id="final-score" class="final-score">0/5</p>
        <button id="play-again" type="button">Jogar de novo</button>
      </div>
    </div>

    <p class="rotate">Gire o celular para jogar</p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
